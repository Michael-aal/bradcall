<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status · Bradcall</title><link rel="stylesheet" href="bradcall.css"><link rel="stylesheet" href="marketplace.css"><link rel="stylesheet" href="communication.css"><script src="config.js"></script></head><body><main class="policy-content"><span class="pill">PAYMENT STATUS</span><h1>Checking your payment…</h1><p id="payment-result">Bradcall is verifying the transaction with Paystack.</p><a class="trust-button" href="trust-center.html">Return to Trust Centre</a></main><script>
(async()=>{const API=(window.BRADCALL_API_URL||(location.hostname==="localhost"||location.hostname==="127.0.0.1"?"http://localhost:5000":location.origin)).replace(/\/$/,""),token=localStorage.getItem("bradcall_token"),q=new URLSearchParams(location.search),ref=q.get("reference")||q.get("trxref"),el=document.querySelector("#payment-result");if(!token||!ref){el.textContent="No signed-in session or payment reference was found. Check payment history in the Trust Centre.";return;}try{const r=await fetch(API+"/api/payments/verify/"+encodeURIComponent(ref),{headers:{Authorization:"Bearer "+token}}),d=await r.json();if(!r.ok)throw Error(d.message||"Payment could not be verified.");el.textContent=d.status==="PAID"?"Payment confirmed by Paystack. Reference: "+d.reference:"Current status: "+d.status+". Please check again if the gateway is still processing.";}catch(e){el.textContent=e.message;}})();
</script></body></html>
